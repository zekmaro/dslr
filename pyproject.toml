[project]
name = "dslr"
version = "0.1.0"
description = "Data Science & Logistic Regression — Hogwarts house classification (42 curriculum)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "flake8>=4.0.0",
    "pre-commit>=2.20.0",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
]

[project.scripts]
describe = "src.scripts.describe:main"
histogram = "src.scripts.histogram:main"
scatter_plot = "src.scripts.scatter_plot:main"
pair_plot = "src.scripts.pair_plot:main"
logreg_train = "src.logreg_train:main"
logreg_predict = "src.logreg_predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
